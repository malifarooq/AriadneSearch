[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "AriadneSearch"
version = "0.0.1"
description = "Local citation graph explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ariadne = "ariadnesearch.cli:main"

[tool.setuptools]
packages = ["ariadnesearch"]

[tool.setuptools.package-data]
ariadnesearch = ["schema.sql", "cache_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
